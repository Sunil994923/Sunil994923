<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Sunil Kumar — Backend and Integration Engineer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1220"/>
      <stop offset="1" stop-color="#13233F"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F59E0B"/>
      <stop offset="1" stop-color="#EF4444"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#FFFFFF" stroke-opacity="0.04"/>
    </pattern>
  </defs>

  <rect width="1200" height="300" rx="16" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="16" fill="url(#grid)"/>

  <!-- Integration flow motif: services connected through a message bus -->
  <g transform="translate(790 70)" fill="none" stroke-linecap="round">
    <path d="M40 40 C 120 40, 120 80, 200 80" stroke="#334155" stroke-width="2"/>
    <path d="M40 120 C 120 120, 120 80, 200 80" stroke="#334155" stroke-width="2"/>
    <path d="M240 80 C 300 80, 300 30, 360 30" stroke="#334155" stroke-width="2"/>
    <path d="M240 80 C 300 80, 300 130, 360 130" stroke="#334155" stroke-width="2"/>
    <path d="M40 40 C 120 40, 120 80, 200 80" stroke="url(#accent)" stroke-width="2" stroke-dasharray="6 10"/>
    <path d="M240 80 C 300 80, 300 130, 360 130" stroke="url(#accent)" stroke-width="2" stroke-dasharray="6 10"/>
    <g fill="#1E293B" stroke="#475569" stroke-width="1.5">
      <rect x="0" y="22" width="40" height="36" rx="8"/>
      <rect x="0" y="102" width="40" height="36" rx="8"/>
      <rect x="196" y="56" width="48" height="48" rx="24" stroke="#F59E0B"/>
      <rect x="360" y="12" width="40" height="36" rx="8"/>
      <rect x="360" y="112" width="40" height="36" rx="8"/>
    </g>
    <g font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" fill="#94A3B8" text-anchor="middle">
      <text x="20" y="80">REST</text>
      <text x="20" y="160">CDC</text>
      <text x="220" y="125">route</text>
      <text x="380" y="68">topic</text>
      <text x="380" y="168">sink</text>
    </g>
  </g>

  <g font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif">
    <text x="64" y="118" font-size="52" font-weight="700" fill="#F8FAFC">Sunil Kumar</text>
    <rect x="66" y="138" width="72" height="4" rx="2" fill="url(#accent)"/>
    <text x="64" y="184" font-size="24" font-weight="500" fill="#CBD5E1">Backend &amp; Integration Engineer</text>
    <text x="64" y="226" font-size="17" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, Consolas, monospace">Java · Apache Camel · webMethods · Kafka · REST APIs</text>
  </g>
</svg>
